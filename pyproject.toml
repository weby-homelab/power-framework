[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "power-framework"
version = "3.7.9"
description = "AI-native toolkit for Second Brain knowledge bases — validate, index, and manage notes via CLI or MCP"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13,<3.15"
authors = [
    { name = "Weby Homelab", email = "rekvizitor.ua@gmail.com" }
]
keywords = ["knowledge-management", "second-brain", "mcp", "ai-agents", "para", "okf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "pathspec>=0.12.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
power = "power_framework.core.cli:main"
power-mcp = "power_framework.mcp.entrypoint:main"
power-web = "power_framework.web.app:main"

[dependency-groups]
dev = [
    "build>=1.2.0",
    "hatchling>=1.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    "mcp>=2.0,<3.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    "bleach>=6.1.0",
    "markdown>=3.6.0",
    "pygments>=2.18.0",
    "itsdangerous>=2.2.0",
    "anyio>=4.4.0",
]
# Optional profiles are explicit so the base install remains FTS-only and does
# not pull a model runtime, tokenizer, numerical stack, or MCP transport.
semantic = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0,<2.5",
]
rerank = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0,<2.5",
    "fastembed>=0.5.0,<1.0.0",
]
gpu = [
    "onnxruntime-gpu>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0,<2.5",
    "nvidia-cuda-runtime>=13,<14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu13>=9.24,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
fleet = []
bench = []
mcp = [
    "mcp>=2.0,<3.0",
]
remote = [
    "mcp>=2.0,<3.0",
]
experimental = [
    "qwen3-embed>=1.12.0",
]
qwen3 = [
    "qwen3-embed>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/weby-homelab/power-framework"
Documentation = "https://github.com/weby-homelab/power-framework#readme"
Repository = "https://github.com/weby-homelab/power-framework"
Issues = "https://github.com/weby-homelab/power-framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/power_framework"]

[tool.hatch.build.targets.wheel.force-include]
"src/power_framework/data/semantic_gt.json" = "power_framework/data/semantic_gt.json"
"skills/power" = "power_framework/data/skills/power"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
addopts = "-v --tb=short --cov=power_framework --cov-report=term-missing --cov-fail-under=70"
markers = [
    "bench: optional real-vault benchmark; never a blocking hermetic CI gate",
    "neural_hermetic: mandatory offline neural contract checks using injected doubles",
    "real_neural: optional pinned local-model integration checks; never downloads in CI",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TCH",
    "S",
    "C4",
    "DTZ",
    "T20",
    "PT",
    "RUF",
    "PERF",
    "RET",
    "LOG",
    "FIX",
]
ignore = ["E501", "S101"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "power_framework.core.markdown_checks",
    "power_framework.experimental.rot_scoring",
    "power_framework.core.healer",
    "power_framework.core.indexer",
    "power_framework.core.parser",
]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = [
    "power_framework.experimental.embeddings",
    "power_framework.core.searcher",
    "power_framework.experimental.reranker",
]
disable_error_code = [
    "import-not-found",
    "import-untyped",
    "no-untyped-def",
    "no-any-return",
    "attr-defined",
    "union-attr",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F405"]
"tests/*" = ["S101", "T20", "DTZ001"]
"tests/web/*.py" = ["S105", "S106"]
"tests/web/**/*.py" = ["S105", "S106"]
"scripts/*" = ["T20", "S310"]
"benchmarks/power31/scripts/*" = ["T20", "RUF001", "RUF002", "RUF003"]
"benchmarks/power31/tests/*" = ["S101", "T20", "DTZ001", "RUF001", "RUF002", "RUF003"]
"benchmarks/power31/schemas/*" = ["RUF001", "RUF002", "RUF003"]
"benchmarks/fts_operator/scripts/*" = ["T20", "RUF001", "RUF002", "RUF003"]
"benchmarks/fts_operator/tests/*" = ["S101", "T20", "DTZ001", "RUF001", "RUF002", "RUF003"]
"tests/test_fts_operator_benchmark.py" = ["S101", "T20", "RUF001", "RUF002", "RUF003"]
"scripts/check_search_quality.py" = ["T20", "S310", "RUF001"]
"src/power_framework/core/cli.py" = ["T201"]
"src/power_framework/mcp/power_server.py" = ["S104"]
# FastAPI declares dependency/form providers in route signatures; these calls are
# route metadata, not eagerly executed application work.
"src/power_framework/web/routes/*.py" = ["B008", "TC001"]
# These strings are intentionally Ukrainian UI translations, not confusable code.
"src/power_framework/web/i18n.py" = ["RUF001"]
