name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed tag to validate; publication requires a tag push"
        required: true
        type: string

permissions: {}

concurrency:
  group: power-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release_input:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - name: Validate workflow dispatch release tag
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  validate:
    needs: release_input
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.release_input.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POWER_EMBED_PROVIDER: bge-m3
      POWER_EMBED_DEVICE: cpu
      POWER_RERANKER: bge
      POWER_RERANKER_DEVICE: cpu
      POWER_MODEL_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', needs.release_input.outputs.release_tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the locked release-gate environment
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install uv==0.11.33
          uv sync --locked --group dev --extra semantic --extra rerank --extra web

      - name: Run mandatory hermetic neural contract
        run: |
          uv run pytest tests/test_neural_hermetic_contract.py -q --no-cov \
            --override-ini=addopts= --strict-markers \
             --junitxml="$RUNNER_TEMP/power-release-neural-hermetic.xml"
          uv run python scripts/verify_neural_contract.py \
             "$RUNNER_TEMP/power-release-neural-hermetic.xml"

      - name: Run release-gate static and documentation checks
        run: |
          uv run ruff check src/ tests/ scripts/ benchmarks/power35/
          uv run ruff format --check src/ tests/ scripts/ benchmarks/power35/
          uv run mypy src/power_framework/
          uv run python scripts/check_doc_drift.py
          uv run python scripts/complexity_dashboard.py --baseline-revision v3.4.5 --require-budget
          uv run mkdocs build --strict --site-dir "$RUNNER_TEMP/power-release-site"

      - name: Run the full release-gate test suite
        run: |
          uv run pytest tests/ -v --tb=short \
            -m "not real_neural and not bench" \
            --junitxml="$RUNNER_TEMP/power-release-junit.xml" \
            --cov=src/power_framework/ \
            --cov-report=term-missing \
            --cov-report=json:"$RUNNER_TEMP/power-release-coverage.json" \
            --cov-fail-under=70 \
            -W error::ResourceWarning \
            -W error::pytest.PytestUnraisableExceptionWarning

      - name: Verify upgrade and fault-injection invariants
        run: |
          uv run python scripts/retention_soak.py \
             --output "$RUNNER_TEMP/power-release-retention.json"
          uv run pytest tests/test_maintenance.py tests/test_maintenance_faults.py \
            -q --no-cov --override-ini=addopts=

      - name: Generate content-free Phase 8 technical receipts
        run: |
          uv run python benchmarks/power35/scripts/run_outcome_benchmark.py \
             --output "$RUNNER_TEMP/power-release-outcome.json"
          uv run python benchmarks/power35/scripts/run_continuity_benchmark.py \
             --output "$RUNNER_TEMP/power-release-continuity.json"
           uv run python - "$RUNNER_TEMP/power-release-outcome.json" "$RUNNER_TEMP/power-release-continuity.json" <<'PY'
          import json
          import pathlib
          import sys

          from power_framework.phase8_contract import (
              CONTINUITY_INDEPENDENT_PROCESSES,
              PHASE8_CONTINUITY_SCHEMA_VERSION,
              PHASE8_OUTCOME_SCHEMA_VERSION,
              SYNTHETIC_WORKFLOW_COUNT,
          )

          outcome = json.loads(pathlib.Path(sys.argv[1]).read_text())
          continuity = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert outcome["schema_version"] == PHASE8_OUTCOME_SCHEMA_VERSION
          assert outcome["synthetic"] is True
          assert outcome["content_free"] is True
          assert outcome["workflow_count"] == SYNTHETIC_WORKFLOW_COUNT
          assert outcome["gate"]["fresh_agent_completion"] >= 0.9
          assert outcome["gate"]["safety_invariants_100"] is True
          assert outcome["gate"]["false_premise_abstention"] is True
          assert outcome["gate"]["stale_state_filter"] is True
          assert outcome["gate"]["technical_continuity_20"] is True
          assert outcome["gate"]["blocked_workflow_abstention"] is True
          assert outcome["gate"]["median_human_reminders"] == 0
          assert outcome["comparison"]["practical_improvement"] is True
          assert outcome["feedback_reuse"]["measured"] is False
          assert outcome["blind_scoring"] is False
          assert outcome["bootstrap_context_tokens"]["measured"] is False
          assert outcome["raw_content_in_report"] is False
          assert outcome["human_quality_certification"] is False
          assert outcome["real_vault"] is False
          assert continuity["schema_version"] == PHASE8_CONTINUITY_SCHEMA_VERSION
          assert continuity["synthetic"] is True
          assert continuity["content_free"] is True
          assert continuity["workflow_count"] == SYNTHETIC_WORKFLOW_COUNT
          assert continuity["independent_processes"] == CONTINUITY_INDEPENDENT_PROCESSES
          assert continuity["gate"]["correct_resume_20"] is True
          assert continuity["gate"]["proof_carrying_handoff"] is True
          assert continuity["gate"]["source_preserved"] is True
          assert continuity["gate"]["power_beats_plain_handoff"] is True
          assert continuity["comparison"]["practical_improvement"] is True
          assert continuity["raw_content_in_report"] is False
          assert continuity["human_quality_certification"] is False
          assert continuity["real_vault"] is False
          print("Phase 8 technical receipts verified; external quality evidence remains closed")
          PY

      - name: Record executed release gates
        run: |
          uv run python scripts/generate_release_gate_manifest.py \
             --output "$RUNNER_TEMP/power-release-gates.json" \
            --passed-mandatory locked-dependencies \
            --passed-mandatory ruff-check \
            --passed-mandatory ruff-format \
            --passed-mandatory mypy \
            --passed-mandatory doc-drift \
            --passed-mandatory complexity-budget \
            --passed-mandatory mkdocs-strict \
            --passed-mandatory full-pytest \
             --passed-mandatory warnings-as-errors \
             --passed-mandatory maintenance-faults \
             --passed-mandatory phase8-technical \
             --passed-mandatory retention-soak \
             --pending-mandatory profile-a-mcp-stdio \
             --pending-mandatory profile-b-web-acceptance \
             --pending-mandatory web-semantic-acceptance \
             --pending-mandatory web-rerank-acceptance \
             --pending-mandatory public-release-readback \
             --skipped-optional real-vault-quality \
             --skipped-optional deferred-macos-windows

      - name: Generate content-free validation receipt
        run: |
          uv run python scripts/generate_release_validation.py \
             --junit-xml "$RUNNER_TEMP/power-release-junit.xml" \
             --coverage-json "$RUNNER_TEMP/power-release-coverage.json" \
             --gate-manifest "$RUNNER_TEMP/power-release-gates.json" \
             --output "$RUNNER_TEMP/power-release-validation.json"

      - name: Upload content-free Phase 8 technical receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: power-release-phase8-technical-receipts
          path: |
            ${{ runner.temp }}/power-release-outcome.json
            ${{ runner.temp }}/power-release-continuity.json
            ${{ runner.temp }}/power-release-gates.json
            ${{ runner.temp }}/power-release-validation.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify the tag-bound candidate contract before publication
        run: |
          uv run pytest tests/test_release_contract.py -q --no-cov --override-ini=addopts=

  upgrade-matrix:
    needs: [release_input, validate]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || needs.release_input.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', needs.release_input.outputs.release_tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the locked upgrade environment
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install uv==0.11.33
          uv sync --locked --group dev --extra web --extra semantic --extra rerank

      - name: Execute the Linux release upgrade matrix on the Ubuntu runner
        run: |
          set -euo pipefail
          target_version="$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          from_version="$(git tag --sort=-version:refname --list 'v*.*.*' | TARGET_VERSION="$target_version" python3 -c 'import os, sys; target=os.environ["TARGET_VERSION"]; print(next(tag[1:] for tag in sys.stdin.read().splitlines() if tag[1:] != target))')"
          uv run python scripts/verify_upgrade_matrix.py \
            --from-version "$from_version" \
            --to-version "$target_version" \
            --output "${{ runner.temp }}/power-upgrade-matrix-${{ matrix.os }}.json"

      - name: Upload platform upgrade evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: power-release-upgrade-${{ matrix.os }}
          path: ${{ runner.temp }}/power-upgrade-matrix-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 7

  upgrade-matrix-aggregate:
    needs: [release_input, upgrade-matrix]
    if: >-
      always() &&
      needs.upgrade-matrix.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || needs.release_input.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', needs.release_input.outputs.release_tag) || github.ref }}

      - name: Download platform upgrade evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: power-release-upgrade-*
          path: ${{ runner.temp }}/power-release-upgrade
          merge-multiple: true

      - name: Aggregate and block on the supported Linux report
        run: |
          python scripts/aggregate_upgrade_matrix.py \
            --input-dir "${{ runner.temp }}/power-release-upgrade" \
            --require-supported-platforms \
            --output "${{ runner.temp }}/power-release-upgrade-aggregate.json"

      - name: Upload aggregated upgrade evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: power-release-upgrade-aggregate
          path: ${{ runner.temp }}/power-release-upgrade-aggregate.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [release_input, validate, upgrade-matrix-aggregate]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.upgrade-matrix-aggregate.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || needs.release_input.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && needs.release_input.outputs.release_tag || github.ref_name }}
      GNUPGHOME: ${{ runner.temp }}/power-release-gnupg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', needs.release_input.outputs.release_tag) || github.ref }}

      - name: Validate the exact release tag checkout
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          local_tag_target="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          remote_tag_target="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | python3 -c 'import sys; fields=sys.stdin.read().split(); print(fields[0] if fields else "")')"
          test -n "$remote_tag_target"
          test "$local_tag_target" = "$remote_tag_target"
          test "$remote_tag_target" = "$(git rev-parse HEAD)"
          printf 'REMOTE_TAG_TARGET=%s\n' "$remote_tag_target" >> "$GITHUB_ENV"

      - name: Verify signed release tag and maintainer fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 700 "$GNUPGHOME"
          key_file="$RUNNER_TEMP/power-release-signing-key.asc"
          gh api users/weby-homelab/gpg_keys \
            --jq '.[] | select(.key_id == "2D49E810C7F2527E") | .raw_key' \
            > "$key_file"
          test -s "$key_file"
          fingerprint="$(gpg --batch --with-colons --show-keys "$key_file" | python3 -c 'import sys; print(next(field[9] for field in (line.split(":") for line in sys.stdin) if field[0] == "fpr"))')"
          test "$fingerprint" = "7AF1EDA195FE29FF093FB1CA2D49E810C7F2527E"
          gpg --batch --import "$key_file"
          verification="$RUNNER_TEMP/power-tag-verification.txt"
          git verify-tag --raw "$RELEASE_TAG" > "$verification" 2>&1
          python3 - "$verification" <<'PY'
          from pathlib import Path
          import sys

          expected_signing = "166E0A4F873E897A8060DD38DD92FC45BD1D6C30"
          expected_primary = "7AF1EDA195FE29FF093FB1CA2D49E810C7F2527E"
          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          valid = [
              fields
              for fields in (line.split() for line in lines)
              if len(fields) >= 12
              and fields[0] == "[GNUPG:]"
              and fields[1] == "VALIDSIG"
              and fields[2] == expected_signing
              and fields[-1] == expected_primary
          ]
          if len(valid) != 1:
              raise SystemExit("signed release tag is not verified by the pinned maintainer key")
          print("signed release tag and maintainer fingerprint verified")
          PY

      - name: Reject mutable manual release recovery
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf '%s\n' "Manual release recovery is validation-only; publish a new signed tag push" >&2
          exit 1

      - name: Reject an existing GitHub release for this tag
        run: |
          set -euo pipefail
          api_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/release-probe.json" \
            --write-out "%{http_code}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          case "$api_status" in
            404) printf '%s\n' "No existing GitHub Release found for $RELEASE_TAG" ;;
            200) printf '%s\n' "A GitHub Release already exists for $RELEASE_TAG" >&2; exit 1 ;;
            *) printf '%s\n' "Unable to prove release absence for $RELEASE_TAG (HTTP $api_status)" >&2; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build tools and framework dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install uv==0.11.33
          uv sync --locked --group dev --extra web --extra semantic --extra rerank

      - name: Pin reproducible build timestamp
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          test -n "$epoch"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          created="$(python3 -c 'from datetime import UTC, datetime; import sys; print(datetime.fromtimestamp(int(sys.argv[1]), UTC).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$epoch")"
          echo "OCI_CREATED=$created" >> "$GITHUB_ENV"

      - name: Download Phase 8 technical receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: power-release-phase8-technical-receipts
          path: ${{ runner.temp }}/power-release-phase8-technical

      - name: Download aggregate upgrade evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: power-release-upgrade-aggregate
          path: ${{ runner.temp }}/power-release-upgrade

      - name: Build reproducible package before binding final evidence
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/power-framework-repro-build"
          source_one="$build_root/source-one"
          source_two="$build_root/source-two"
          dist_one="$build_root/dist-one"
          dist_two="$build_root/dist-two"
          mkdir -p "$source_one" "$source_two" "$dist_one" "$dist_two"
          git archive --format=tar HEAD | tar -xf - -C "$source_one"
          git archive --format=tar HEAD | tar -xf - -C "$source_two"

          uv run python -m build --no-isolation --outdir "$dist_one" "$source_one"
          uv run python scripts/normalize_sdist.py "$dist_one"/*.tar.gz
          uv run python -m build --no-isolation --outdir "$dist_two" "$source_two"
          uv run python scripts/normalize_sdist.py "$dist_two"/*.tar.gz

          mapfile -t wheels_one < <(
            find "$dist_one" -maxdepth 1 -type f -name '*.whl' -print | sort
          )
          mapfile -t wheels_two < <(
            find "$dist_two" -maxdepth 1 -type f -name '*.whl' -print | sort
          )
          mapfile -t sdists_one < <(
            find "$dist_one" -maxdepth 1 -type f -name '*.tar.gz' -print | sort
          )
          mapfile -t sdists_two < <(
            find "$dist_two" -maxdepth 1 -type f -name '*.tar.gz' -print | sort
          )
          test "${#wheels_one[@]}" -eq 1
          test "${#wheels_two[@]}" -eq 1
          test "${#sdists_one[@]}" -eq 1
          test "${#sdists_two[@]}" -eq 1
          cmp -- "${wheels_one[0]}" "${wheels_two[0]}"
          cmp -- "${sdists_one[0]}" "${sdists_two[0]}"

          mkdir -p dist
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -delete
          cp -- "${wheels_one[0]}" "${sdists_one[0]}" dist/

      - name: Stage the exact package subject for SBOM generation
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          wheel="dist/power_framework-${version}-py3-none-any.whl"
          test -f "$wheel"
          cp -- "$wheel" "$RUNNER_TEMP/power-framework-package.whl"

      - name: Generate package SPDX SBOM bound to the exact wheel
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ runner.temp }}/power-framework-package.whl
          format: spdx-json
          output-file: dist/power-framework.spdx.json

      - name: Normalize package SBOM identity
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mv -- dist/power-framework.spdx.json "dist/power-framework-${version}.spdx.json"

      - name: Authenticate to GHCR for the Web-only image
        env:
          GH_TOKEN: ${{ secrets.POWER_RELEASE_GHCR_TOKEN || github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the Web-only image
        id: web_image
        env:
          IMAGE_REF: ghcr.io/weby-homelab/power-framework-web:${{ env.RELEASE_TAG }}
          POWER_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REF/:v/:}"
          version="${POWER_VERSION#v}"
          source_revision="$(git rev-list -n 1 "$RELEASE_TAG")"
          wheel_name="power_framework-${version}-py3-none-any.whl"
          test -f "dist/$wheel_name"
          cp -- "dist/$wheel_name" "release/$wheel_name"
          docker buildx build \
            --file deploy/web/Dockerfile \
            --build-arg "POWER_VERSION=$version" \
            --build-arg "POWER_WHEEL_FILE=$wheel_name" \
            --build-arg "POWER_SOURCE_REVISION=$source_revision" \
            --build-arg "POWER_RELEASE_TAG=$RELEASE_TAG" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --build-arg "OCI_CREATED=$OCI_CREATED" \
            --tag "$image_ref" \
            --push \
            .
          digest="$(docker buildx imagetools inspect "$image_ref" | python3 -c 'import sys; print(next(line.split()[1] for line in sys.stdin if line.startswith("Digest:")))')"
          test "${digest#sha256:}" != "$digest"
          test "$(printf '%s' "$digest" | wc -c)" -eq 71
          echo "reference=$image_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Prefetch locked model snapshots for real Web acceptance
        env:
          HF_HOME: ${{ runner.temp }}/power-model-cache
        run: |
          uv run python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="aapot/bge-m3-onnx",
              revision="76a603396f5eb9f03ed51bbab8f4893fcea7b2fe",
              allow_patterns=["model.onnx", "model.onnx.data", "tokenizer.json"],
          )
          snapshot_download(
              repo_id="onnx-community/bge-reranker-v2-m3-ONNX",
              revision="6f5ff65298512715a1e669753bc754d2bc8f367b",
              allow_patterns=["onnx/model.onnx", "onnx/model.onnx_data", "tokenizer.json"],
          )
          print("locked model snapshots prefetched")
          PY

      - name: Checkout current acceptance harness for tag recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: ${{ runner.temp }}/.release-acceptance-harness
          sparse-checkout: |
            scripts/profile_acceptance.py
            tests/__init__.py
            tests/mcp_test_client.py
          sparse-checkout-cone-mode: false

      - name: Verify acceptance harness revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HARNESS_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          harness_revision="$(git -C "$RUNNER_TEMP/.release-acceptance-harness" rev-parse --verify HEAD)"
          test "$harness_revision" = "$EXPECTED_HARNESS_REVISION"
          printf 'ACCEPTANCE_HARNESS_REVISION=%s\n' "$harness_revision" >> "$GITHUB_ENV"

      - name: Prove Profile A/B against the exact Web image
        id: profile_acceptance
        env:
          HF_HOME: ${{ runner.temp }}/power-model-cache
          POWER_MODEL_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          POWER_EMBED_PROVIDER: bge-m3
          POWER_EMBED_DEVICE: cpu
          POWER_RERANKER: bge
          POWER_RERANKER_DEVICE: cpu
          WEB_IMAGE_REF: ${{ steps.web_image.outputs.reference }}
          WEB_IMAGE_DIGEST: ${{ steps.web_image.outputs.digest }}
          ACCEPTANCE_HARNESS_ROOT: ${{ github.event_name == 'workflow_dispatch' && format('{0}/.release-acceptance-harness', runner.temp) || '.' }}
          ACCEPTANCE_HARNESS_REVISION: ${{ github.sha }}
        run: |
          image_ref="${WEB_IMAGE_REF%@*}@${WEB_IMAGE_DIGEST}"
          uv run python "$ACCEPTANCE_HARNESS_ROOT/scripts/profile_acceptance.py" \
            --image "$image_ref" \
            --image-digest "$WEB_IMAGE_DIGEST" \
            --model-cache "$HF_HOME" \
            --version "${RELEASE_TAG#v}" \
            --output "$RUNNER_TEMP/power-profile-acceptance.json"

      - name: Generate Web SPDX SBOM bound to the exact image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.web_image.outputs.reference }}@${{ steps.web_image.outputs.digest }}
          format: spdx-json
          output-file: dist/power-web.spdx.json

      - name: Normalize Web SBOM identity
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mv -- dist/power-web.spdx.json "dist/power-web-${version}.spdx.json"

      - name: Attest package artifacts
        id: package_attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest the published Web image digest
        id: web_attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/weby-homelab/power-framework-web
          subject-digest: ${{ steps.web_image.outputs.digest }}
          push-to-registry: true

      - name: Generate the exact unified release manifest
        env:
          WEB_IMAGE_REF: ${{ steps.web_image.outputs.reference }}
          WEB_IMAGE_DIGEST: ${{ steps.web_image.outputs.digest }}
          PACKAGE_ATTESTATION_ID: ${{ steps.package_attestation.outputs.attestation-id }}
          WEB_ATTESTATION_ID: ${{ steps.web_attestation.outputs.attestation-id }}
          PROFILE_EVIDENCE: ${{ runner.temp }}/power-profile-acceptance.json
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          package_sbom="dist/power-framework-${version}.spdx.json"
          web_sbom="dist/power-web-${version}.spdx.json"
          cp -- "$PROFILE_EVIDENCE" dist/power-profile-acceptance.json
          test -n "$PACKAGE_ATTESTATION_ID"
          test -n "$WEB_ATTESTATION_ID"
          uv run python scripts/build_release_manifest.py \
            --wheel "dist/power_framework-${version}-py3-none-any.whl" \
            --sdist "dist/power_framework-${version}.tar.gz" \
            --version "$version" \
            --commit "$commit" \
            --web-image "$WEB_IMAGE_REF" \
            --web-image-digest "$WEB_IMAGE_DIGEST" \
            --package-sbom "$package_sbom" \
            --web-sbom "$web_sbom" \
            --profile-evidence "$PROFILE_EVIDENCE" \
            --attestation "github:${PACKAGE_ATTESTATION_ID}" \
            --attestation "github:${WEB_ATTESTATION_ID}" \
            --output dist/power-release-manifest.json

      - name: Generate and verify tag-bound release baseline
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          package_sbom="dist/power-framework-${version}.spdx.json"
          uv run python scripts/generate_release_baseline.py \
             --tag "$RELEASE_TAG" \
             --validation-report "$RUNNER_TEMP/power-release-phase8-technical/power-release-validation.json" \
             --sbom "$package_sbom" \
             --upgrade-matrix-aggregate "$RUNNER_TEMP/power-release-upgrade/power-release-upgrade-aggregate.json" \
             --phase8-outcome-receipt "$RUNNER_TEMP/power-release-phase8-technical/power-release-outcome.json" \
             --phase8-continuity-receipt "$RUNNER_TEMP/power-release-phase8-technical/power-release-continuity.json" \
            --output dist/power-framework.release-baseline.json
          uv run python scripts/verify_release_contract.py \
             --require-tag \
             --require-signed-tag \
             --sbom "$package_sbom" \
             --upgrade-matrix-aggregate "$RUNNER_TEMP/power-release-upgrade/power-release-upgrade-aggregate.json" \
             --baseline dist/power-framework.release-baseline.json

      - name: Smoke-test wheel and sdist outside checkout
        run: |
          uv run python scripts/smoke_package.py \
            --wheel dist/power_framework-*.whl \
            --sdist dist/power_framework-*.tar.gz

      - name: Generate deterministic release checksums
        run: |
          uv run python - <<'PY'
          import hashlib
          from pathlib import Path

          excluded = {
              "SHA256SUMS",
              "power-framework.release-receipt.json",
              "power-framework.github-readback.json",
          }
          assets = sorted(
              path for path in Path("dist").iterdir() if path.is_file() and path.name not in excluded
          )
          lines = []
          for path in assets:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Select tag-matched release notes
        id: release_notes
        shell: bash
        run: echo "path=docs/release-${RELEASE_TAG#v}.md" >> "$GITHUB_OUTPUT"

      - name: Generate release receipt from frozen assets
        env:
          PACKAGE_ATTESTATION_ID: ${{ steps.package_attestation.outputs.attestation-id }}
          WEB_ATTESTATION_ID: ${{ steps.web_attestation.outputs.attestation-id }}
          WEB_IMAGE_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          wheel_sha="$(sha256sum -- "dist/power_framework-${version}-py3-none-any.whl" | python3 -c 'import sys; print(sys.stdin.read().split()[0])')"
          sdist_sha="$(sha256sum -- "dist/power_framework-${version}.tar.gz" | python3 -c 'import sys; print(sys.stdin.read().split()[0])')"
          uv run python scripts/generate_release_receipt.py \
            --tag "$RELEASE_TAG" \
            --assets-dir dist \
            --release-manifest "dist/power-release-manifest.json" \
            --attestation-id "$PACKAGE_ATTESTATION_ID" \
            --attestation-id "$WEB_ATTESTATION_ID" \
            --attestation-subject-role "${PACKAGE_ATTESTATION_ID}=package" \
            --attestation-subject-role "${WEB_ATTESTATION_ID}=web" \
            --attestation-subject "${PACKAGE_ATTESTATION_ID}=${wheel_sha}" \
            --attestation-subject "${PACKAGE_ATTESTATION_ID}=${sdist_sha}" \
            --attestation-subject "${WEB_ATTESTATION_ID}=${WEB_IMAGE_DIGEST}" \
            --output "dist/power-framework.release-receipt.json"

      - name: Verify frozen release bindings before publication
        run: |
          uv run python scripts/verify_public_release_bindings.py \
            --tag "$RELEASE_TAG" \
            --manifest "dist/power-release-manifest.json" \
            --checksums "dist/SHA256SUMS" \
            --asset-dir dist \
            --receipt "dist/power-framework.release-receipt.json" \
            --expected-tag-target "$REMOTE_TAG_TARGET"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: false
          files: |
            dist/power-framework.release-baseline.json
            dist/power-release-manifest.json
            dist/power-profile-acceptance.json
            dist/power-framework.release-receipt.json
            dist/SHA256SUMS
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json

      - name: Read back GitHub release metadata and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,body,assets \
            > dist/power-framework.github-readback.json
          uv run python - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys

          expected_tag = sys.argv[1]
          readback = json.loads(
              pathlib.Path("dist/power-framework.github-readback.json").read_text()
          )
          notes_path = pathlib.Path(f"docs/release-{expected_tag.removeprefix('v')}.md")
          assert readback["tagName"] == expected_tag
          assert readback["body"] == notes_path.read_text()
          asset_names = {asset["name"] for asset in readback["assets"]}
          version = expected_tag.removeprefix("v")
          required = {
              "power-framework.release-baseline.json",
               "power-release-manifest.json",
               "power-profile-acceptance.json",
              "power-framework.release-receipt.json",
              "SHA256SUMS",
              f"power_framework-{version}-py3-none-any.whl",
              f"power_framework-{version}.tar.gz",
              f"power-framework-{version}.spdx.json",
              f"power-web-{version}.spdx.json",
          }
          assert asset_names == required
          print("GitHub release readback verified")
          PY

      - name: Verify public asset checksums, manifest bindings, and OCI readback
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_IMAGE_REF: ${{ steps.web_image.outputs.reference }}
          WEB_IMAGE_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          readback_dir="$RUNNER_TEMP/power-public-readback"
          mkdir -p "$readback_dir"
          gh release download "$RELEASE_TAG" --dir "$readback_dir" --clobber
          uv run python scripts/verify_public_release_bindings.py \
            --tag "$RELEASE_TAG" \
            --manifest "$readback_dir/power-release-manifest.json" \
            --checksums "$readback_dir/SHA256SUMS" \
            --asset-dir "$readback_dir" \
            --receipt "$readback_dir/power-framework.release-receipt.json" \
            --expected-tag-target "$REMOTE_TAG_TARGET"
          registry_digest="$(docker buildx imagetools inspect "$WEB_IMAGE_REF" | python3 -c 'import sys; print(next(line.split()[1] for line in sys.stdin if line.startswith("Digest:")))')"
          test "$registry_digest" = "$WEB_IMAGE_DIGEST"
