name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked
          uv run python -m pip check

      - name: Verify Windows CLI and clean-vault lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vault = Join-Path $env:RUNNER_TEMP "power-vault"

          uv run power --version
          uv run python -c "import power_framework.mcp, onnxruntime; print('imports: OK')"
          $env:POWER_EMBED_DEVICE = "auto"
          uv run python -c "import onnxruntime as ort; from power_framework.core.embeddings import select_onnx_providers; selected = select_onnx_providers(ort); print('available providers:', ort.get_available_providers()); print('selected providers:', selected); assert any((p[0] if isinstance(p, tuple) else p) == 'CPUExecutionProvider' for p in selected)"
          uv run power init $vault
          uv run power ingest $vault --type Resource --title "First Note" --description "Windows smoke note"
          $nestedA = Join-Path $vault "03_Resources\Nested Space"
          $nestedB = Join-Path $vault "03_Resources\Nested Space\Deep"
          New-Item -ItemType Directory -Force $nestedB | Out-Null
          @"
          ---
          type: Resource
          title: "Duplicate A"
          description: "Nested Windows smoke note A"
          timestamp: 2026-08-09T00:00:00Z
          ---

          # Duplicate A
          "@ | Set-Content -Encoding utf8 (Join-Path $nestedA "Same Name.md")
          @"
          ---
          type: Resource
          title: "Duplicate B"
          description: "Nested Windows smoke note B"
          timestamp: 2026-08-09T00:00:00Z
          ---

          # Duplicate B
          "@ | Set-Content -Encoding utf8 (Join-Path $nestedB "Same Name.md")
          uv run power index $vault --strict
          $lintResult = uv run power lint $vault
          $lintText = $lintResult -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $lintText -match "[\\/]_index\.md") {
            throw "Lint treated a generated sub-index as an orphan note"
          }
          $lintText
          uv run power markdown-check $vault
          uv run power sync $vault --fts-only --strict
          $searchResult = uv run power search $vault "Windows smoke" --mode fts
          $searchText = $searchResult -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $searchText -notmatch "First Note") {
            throw "FTS acceptance check did not return First Note"
          }
          $searchText
          uv run power status $vault

  macos-runtime-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked
          uv run python -m pip check

      - name: Verify macOS CLI and FTS lifecycle without model download
        env:
          HF_HUB_OFFLINE: "1"
          POWER_EMBED_DEVICE: cpu
          POWER_RERANKER_DEVICE: cpu
          XDG_CACHE_HOME: ${{ runner.temp }}/power-cache
        run: |
          set -euo pipefail
          vault="${RUNNER_TEMP}/power-vault"

          uv run power --version
          uv run python -c "import power_framework.mcp, onnxruntime; print('imports: OK')"
          uv run power init "$vault"
          uv run power ingest "$vault" --type Resource --title "macOS smoke note" --description "macOS runtime smoke note"
          uv run power index "$vault" --strict
          uv run power lint "$vault"
          uv run power markdown-check "$vault"
          uv run power sync "$vault" --fts-only --strict
          search_result="$(uv run power search "$vault" "macOS smoke" --mode fts)"
          if ! grep -Fq "macOS smoke note" <<<"$search_result"; then
            printf '%s\n' "$search_result"
            echo "FTS acceptance check did not return macOS smoke note" >&2
            exit 1
          fi
          if ! grep -Fq "Index coverage: 1/1" <<<"$search_result" || grep -Fq "pending:" <<<"$search_result"; then
            printf '%s\n' "$search_result"
            echo "FTS acceptance check reported stale index coverage" >&2
            exit 1
          fi
          printf '%s\n' "$search_result"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Run Ruff linter
        run: uv run ruff check src/ tests/ scripts/

      - name: Run Ruff formatter check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Run MyPy type check
        if: ${{ matrix.python-version == '3.13' }}
        run: uv run mypy src/power_framework/

      - name: Verify current documentation contract
        run: uv run python scripts/check_doc_drift.py

      - name: Verify release metadata contract
        run: uv run python scripts/verify_release_contract.py

      - name: Run tests with coverage and resource warning gates
        run: uv run pytest tests/ -v --tb=short --cov=src/power_framework/ --cov-report=term-missing --cov-fail-under=70 -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning

  benchmark-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Run hermetic frozen benchmark checks
        run: uv run pytest benchmarks/power31/tests -q --no-cov --override-ini=addopts=

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --skip-editable

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Smoke-test wheel and sdist outside checkout
        run: |
          uv run python scripts/smoke_package.py \
            --wheel dist/power_framework-*.whl \
            --sdist dist/power_framework-*.tar.gz
