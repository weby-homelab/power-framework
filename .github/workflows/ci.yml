name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Run Ruff linter
        run: ruff check src/ tests/ scripts/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/ scripts/

      - name: Run MyPy type check
        if: ${{ matrix.python-version == '3.13' }}
        run: mypy src/power_framework/

      - name: Verify current documentation contract
        run: python scripts/check_doc_drift.py

      - name: Verify release metadata contract
        run: python scripts/verify_release_contract.py

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src/power_framework/ --cov-report=term-missing --cov-fail-under=70

  benchmark-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Run hermetic frozen benchmark checks
        run: pytest benchmarks/power31/tests -q --no-cov --override-ini=addopts=

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip
          pip-audit --skip-editable

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.33
          uv sync --locked --group dev

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke-test wheel and sdist outside checkout
        run: |
          python scripts/smoke_package.py \
            --wheel dist/power_framework-*.whl \
            --sdist dist/power_framework-*.tar.gz
